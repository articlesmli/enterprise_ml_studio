services:
  postgres:
    image: postgres:15-alpine
    container_name: ml-postgres
    environment:
      POSTGRES_DB: ml_studio
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d ml_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: ml-superset
    environment:
      - SUPERSET_ENV=production
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset_config.py:/app/superset_config.py
    networks:
      - studio-net
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://ml_user:ml_password@ml-postgres:5432/ml_studio
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://ml_user:ml_password@ml-postgres:5432/ml_studio --default-artifact-root /mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studio-net
    restart: unless-stopped

  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: ml-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8079:8080"
      - "7077:7077"
    networks:
      - studio-net
    restart: unless-stopped

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: ml-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://ml-spark-master:7077
    depends_on:
      - spark-master
    networks:
      - studio-net
    restart: unless-stopped

volumes:
  postgres_data:
  superset_home:
  mlflow_artifacts:

networks:
  studio-net:
    driver: bridge