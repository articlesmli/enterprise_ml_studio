apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ml-deployment
  labels:
    app: enterprise-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-ml
  template:
    metadata:
      labels:
        app: enterprise-ml
    spec:
      containers:
      - name: ml-studio
        image: enterprise_ml_studio:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ml-service
spec:
  type: NodePort
  selector:
    app: enterprise-ml
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
